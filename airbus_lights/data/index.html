<!DOCTYPE html>
<html>
<head>
    <title>Airbus Light Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Airbus Lights</h1>

        <div class="section">
            <div class="control-row">
                <span>Master Power</span>
                <label class="switch">
                    <input type="checkbox" id="masterOn" onchange="updateMaster()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="control-row">
                <span>Master Brightness</span>
                <input type="range" id="masterBrightness" min="0" max="255" oninput="updateMaster()">
            </div>
        </div>

        <div class="section">
            <h3>Navigation</h3>
            <div class="control-row">
                <label class="switch">
                    <input type="checkbox" id="navState" onchange="updateChannel('nav')">
                    <span class="slider"></span>
                </label>
                <input type="range" id="navBrightness" min="0" max="255" oninput="updateChannel('nav')">
            </div>
        </div>

        <div class="section">
            <h3>Strobes</h3>
            <div class="control-row">
                <span>Wing</span>
                <label class="switch">
                    <input type="checkbox" id="strobeWingState" onchange="updateChannel('strobeWing')">
                    <span class="slider"></span>
                </label>
                <input type="range" id="strobeWingBrightness" min="0" max="255" oninput="updateChannel('strobeWing')">
            </div>
            <div class="control-row">
                <span>Tail</span>
                <label class="switch">
                    <input type="checkbox" id="strobeTailState" onchange="updateChannel('strobeTail')">
                    <span class="slider"></span>
                </label>
                <input type="range" id="strobeTailBrightness" min="0" max="255" oninput="updateChannel('strobeTail')">
            </div>
        </div>

        <div class="section">
            <h3>Beacon</h3>
            <div class="control-row">
                <label class="switch">
                    <input type="checkbox" id="beaconState" onchange="updateChannel('beacon')">
                    <span class="slider"></span>
                </label>
                <input type="range" id="beaconBrightness" min="0" max="255" oninput="updateChannel('beacon')">
            </div>
            <div class="control-row">
                <span>Mode: <span id="beaconModeText">Pulse</span></span>
                <label class="switch">
                    <input type="checkbox" id="beaconPulseMode" onchange="updateBeaconMode()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
